<div class="min-h-screen bg-[var(--color-surface-alt)]">
  <header class="sticky top-0 z-10 border-b border-[var(--color-border)] bg-[var(--color-surface)]/90 backdrop-blur">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <a routerLink="/games" class="flex items-center gap-2 text-lg font-bold tracking-tight text-[var(--color-text)]">
        <span class="flex h-8 w-8 items-center justify-center rounded-lg bg-[var(--color-accent)] text-sm font-bold text-white">S</span>
        Steamscope
      </a>
      <div class="flex items-center gap-6">
        <a routerLink="/games" class="text-sm font-medium text-[var(--color-text-muted)] hover:text-[var(--color-text)]">
          Browse games
        </a>
        <a routerLink="/search" class="text-sm font-medium text-[var(--color-text-muted)] hover:text-[var(--color-text)]">
          Search
        </a>
        <button
          (click)="toggleTheme()"
          class="flex h-8 w-8 items-center justify-center rounded-lg border border-[var(--color-border)] text-sm hover:bg-[var(--color-surface-alt)]"
          [attr.aria-label]="'Switch to ' + (theme() === 'dark' ? 'light' : 'dark') + ' mode'"
        >
          {{ theme() === 'dark' ? '☀️' : '🌙' }}
        </button>
      </div>
    </nav>
  </header>
  <main>
    <router-outlet />
  </main>
</div>
