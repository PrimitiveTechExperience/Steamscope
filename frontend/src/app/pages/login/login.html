<div class="mx-auto max-w-md px-6 py-16">
    <div class="edge-panel p-6">
        <h1 class="text-2xl font-black uppercase tracking-tight text-[var(--color-text)]" style="font-family: var(--font-display);">
            Log in
        </h1>
        <p class="mt-1 text-sm text-[var(--color-text-muted)]">
            Welcome back. No account yet? <a routerLink="/register" class="font-bold text-[var(--color-accent)] hover:underline">Sign up</a>
        </p>

        @if (error()) {
            <p class="mt-4 border-2 border-[var(--color-accent)] bg-[var(--color-accent-soft)] px-3 py-2 text-sm text-[var(--color-accent)]">
                {{ error() }}
            </p>
        }

        <form class="mt-6 flex flex-col gap-4" (ngSubmit)="submit()">
            <label class="flex flex-col gap-1 text-xs font-bold uppercase text-[var(--color-text-muted)]">
                Username or email
                <input
                    name="login"
                    [(ngModel)]="login"
                    autocomplete="username"
                    class="border-2 border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-2 text-sm font-normal normal-case text-[var(--color-text)]"
                />
            </label>
            <label class="flex flex-col gap-1 text-xs font-bold uppercase text-[var(--color-text-muted)]">
                Password
                <input
                    name="password"
                    type="password"
                    [(ngModel)]="password"
                    autocomplete="current-password"
                    class="border-2 border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-2 text-sm font-normal normal-case text-[var(--color-text)]"
                />
            </label>
            <button type="submit" [disabled]="submitting()" class="edge-btn bg-[var(--color-accent)] px-4 py-2.5 text-sm text-white disabled:opacity-60">
                {{ submitting() ? 'Logging in...' : 'Log in' }}
            </button>
        </form>

        <div class="my-5 flex items-center gap-3 text-xs uppercase text-[var(--color-text-muted)]">
            <span class="h-0.5 flex-1 bg-[var(--color-border)]"></span>or<span class="h-0.5 flex-1 bg-[var(--color-border)]"></span>
        </div>

        <a [href]="steamLoginUrl" class="edge-btn flex items-center justify-center gap-2 bg-[#171a21] px-4 py-2.5 text-sm text-white">
            Sign in through Steam
        </a>
        <p class="mt-2 text-xs text-[var(--color-text-muted)]">
            Works once you've linked Steam from your account page.
        </p>
    </div>
</div>
