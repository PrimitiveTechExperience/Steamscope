<div class="mx-auto max-w-md px-6 py-16">
    <div class="edge-panel p-6">
        <h1 class="text-2xl font-black uppercase tracking-tight text-[var(--color-text)]" style="font-family: var(--font-display);">
            Choose a new password
        </h1>

        @if (!token) {
            <p class="error-message mt-4 border-2 border-[var(--color-accent)] bg-[var(--color-accent-soft)] px-3 py-2 text-sm text-[var(--color-accent)]">
                This link is incomplete. Open the link from the email again, or ask for a new one.
            </p>
            <p class="mt-4 text-sm">
                <a routerLink="/forgot-password" class="font-bold text-[var(--color-accent)] hover:underline">Get a new reset link</a>
            </p>
        } @else {
            <p class="mt-1 text-sm text-[var(--color-text-muted)]">
                Changing it signs you out on every device.
            </p>

            @if (error()) {
                <p class="error-message mt-4 border-2 border-[var(--color-accent)] bg-[var(--color-accent-soft)] px-3 py-2 text-sm text-[var(--color-accent)]">
                    {{ error() }}
                    @if (error()!.includes('expired')) {
                        <a routerLink="/forgot-password" class="ml-1 font-bold underline">Get a new link</a>
                    }
                </p>
            }

            <form class="mt-6 flex flex-col gap-4" (ngSubmit)="submit()">
                <label class="flex flex-col gap-1 text-xs font-bold uppercase text-[var(--color-text-muted)]">
                    New password
                    <input
                        name="password"
                        type="password"
                        [(ngModel)]="password"
                        autocomplete="new-password"
                        maxlength="128"
                        class="border-2 border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-2 text-sm font-normal normal-case text-[var(--color-text)]"
                    />
                </label>
                <label class="flex flex-col gap-1 text-xs font-bold uppercase text-[var(--color-text-muted)]">
                    Repeat it
                    <input
                        name="confirm"
                        type="password"
                        [(ngModel)]="confirm"
                        autocomplete="new-password"
                        maxlength="128"
                        class="border-2 border-[var(--color-border)] bg-[var(--color-surface)] px-3 py-2 text-sm font-normal normal-case text-[var(--color-text)]"
                    />
                </label>
                <button type="submit" [disabled]="submitting()" class="edge-btn bg-[var(--color-accent)] px-4 py-2.5 text-sm text-white disabled:opacity-60">
                    {{ submitting() ? 'Saving...' : 'Set new password' }}
                </button>
            </form>
        }
    </div>
</div>
