<div class="min-h-screen bg-gray-100 p-8">
    <div class="mx-auto max-w-7x1">
        <h1 class="mb-6 text-3x1 font-bold">
            Games
        </h1>
        <div class="mb-6">
            <input
                type="text"
                placeholder="Search games"
                class="w-full rounded-lg border bg-white px-4 py-2"
                [(ngModel)]="searchTerm"
                (keyup.enter)="search()"
            />
            <button
                class="ml-2 rounded-lg bg-blue-500 px-4 py-2 text-white hover:bg-blue-600"
                (click)="search()"
            >
                Search
            </button>
        </div>
        <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
            @for (game of games(); track game.app_id){
                <app-game-card [game]="game" />
            }
        </div>
    </div>
</div>
