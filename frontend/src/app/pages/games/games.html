<div class="mx-auto max-w-6xl px-6 py-10">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div>
            <h1 class="text-3xl font-black uppercase tracking-tight text-[var(--color-text)]" style="font-family: var(--font-display);">
                Games
            </h1>
            <p class="mt-1 text-sm text-[var(--color-text-muted)]">
                Track prices and discounts across the Steam store.
            </p>
        </div>
        <div class="flex w-full max-w-md items-center gap-2">
            <input
                type="text"
                placeholder="Search games"
                class="edge-panel-sm w-full px-4 py-2 text-sm text-[var(--color-text)] outline-none placeholder:text-[var(--color-text-muted)]"
                [(ngModel)]="searchTerm"
                (keyup.enter)="search()"
            />
            <button
                class="edge-btn shrink-0 bg-[var(--color-accent)] px-4 py-2 text-sm text-white"
                (click)="search()"
            >
                Search
            </button>
        </div>
    </div>
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
        @for (game of games(); track game.app_id){
            <app-game-card [game]="game" />
        } @empty {
            <p class="col-span-full py-16 text-center text-sm text-[var(--color-text-muted)]">
                No games found.
            </p>
        }
    </div>
</div>
