<a
    [routerLink]="['/bundles', bundle().bundle_id]"
    class="edge-panel-sm group flex flex-col overflow-hidden transition duration-300 ease-out hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[6px_6px_0_0_var(--color-border)]"
>
    <div class="relative aspect-video w-full overflow-hidden border-b-2 border-[var(--color-border)] bg-[var(--color-surface-alt)]">
        <app-bundle-art [bundle]="bundle()" class="block h-full w-full transition duration-500 ease-out group-hover:scale-110" />
        @if (bundle().discount_percentage > 0) {
            <span class="edge-btn absolute right-2 top-2 -rotate-2 bg-[var(--color-discount)] px-2 py-1 text-xs text-white">
                -{{ bundle().discount_percentage }}%
            </span>
        }
    </div>
    <div class="flex flex-1 flex-col gap-2 p-4">
        <h2 class="line-clamp-2 text-base font-bold text-[var(--color-text)] transition-colors duration-300 group-hover:text-[var(--color-accent)]" style="font-family: var(--font-display);">
            {{ bundle().name }}
        </h2>
        <p class="text-xs text-[var(--color-text-muted)]">{{ bundle().game_count }} games</p>
        <div class="mt-auto flex items-center justify-between pt-2">
            @if (bundle().discount_percentage > 0) {
                <span class="text-xs text-[var(--color-text-muted)] line-through">{{ bundle().original_price | currency }}</span>
            }
            <span class="text-lg font-bold text-[var(--color-text)]">{{ bundle().price | currency }}</span>
        </div>
    </div>
</a>
